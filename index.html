<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Property Dashboard</h1>
      <p>Manage, track, and analyze your property listings</p>
    </header>

    <section class="card form-card">
      <div class="form-header">
        <h2 id="formTitle">Add New Property</h2>
        <button id="cancelEditBtn" type="button" class="secondary hidden">Cancel Edit</button>
      </div>
      <form id="propertyForm">
        <div class="grid">
          <label>
            Property Type
            <select name="building" required>
              <option value="">Select Property Type</option>
              <option value="House">House</option>
              <option value="Villa">Villa</option>
              <option value="Apartment">Apartment</option>
              <option value="Townhouse">Townhouse</option>
              <option value="Land">Land</option>
              <option value="Office">Office</option>
              <option value="Warehouse">Warehouse</option>
              <option value="Shop">Shop</option>
            </select>
          </label>
          <label>
            Property Name
            <input type="text" name="property_name" placeholder="Enter property name" required />
          </label>
          <label>
            Land Size (m²)
            <input type="number" step="0.01" name="land_size" required />
          </label>
          <label>
            Building Size (m²)
            <input type="number" step="0.01" name="building_size" required />
          </label>
          <label>
            Bedrooms
            <input type="number" name="bedrooms" min="0" required />
          </label>
          <label>
            Bathrooms
            <input type="number" name="bathrooms" min="0" required />
          </label>
          <label>
            Garage
            <input type="number" name="garage" min="0" value="0" required />
          </label>
          <label>
            Carport
            <input type="number" name="carport" min="0" value="0" required />
          </label>
          <label>
            Furnishing
            <select name="furnishing" required>
              <option value="None">None</option>
              <option value="Semi Furnished">Semi Furnished</option>
              <option value="Fully Furnished">Fully Furnished</option>
            </select>
          </label>
        </div>

        <div class="checks">
          <label>Clean Kitchen <input type="number" step="0.01" name="clean_kitchen" /></label>
          <label>Service Kitchen <input type="number" step="0.01" name="service_kitchen" /></label>
          <label>Electricity <input type="number" step="0.01" name="electricity" /></label>
          <label>Swimming Pool <input type="number" step="0.01" name="swimming_pool" /></label>
          <label>Security Post <input type="number" step="0.01" name="security_post" /></label>
          <label>Price <input type="number" step="0.01" name="price" required /></label>
        </div>

        <div class="form-actions">
          <button id="submitBtn" type="submit">Create Property</button>
        </div>
        <div id="formNotice" class="notice" aria-live="polite"></div>
      </form>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>Property Listings</h2>
        <div class="header-actions">
          <button id="refreshBtn" type="button" class="secondary">Refresh</button>
        </div>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search by name, code, or type" aria-label="Search properties" />
        <select id="buildingFilter" aria-label="Filter by property type">
          <option value="all">All types</option>
          <option value="House">House</option>
          <option value="Villa">Villa</option>
          <option value="Apartment">Apartment</option>
          <option value="Townhouse">Townhouse</option>
          <option value="Land">Land</option>
          <option value="Office">Office</option>
          <option value="Warehouse">Warehouse</option>
          <option value="Shop">Shop</option>
        </select>
      </div>

      <div id="stats" class="stats"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Property</th>
              <th>Land</th>
              <th>Building</th>
              <th>Beds</th>
              <th>Baths</th>
              <th>Price</th>
              <th>Features</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="propertyTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001/api/properties';

    const propertyForm = document.getElementById('propertyForm');
    const propertyTableBody = document.getElementById('propertyTableBody');
    const refreshBtn = document.getElementById('refreshBtn');
    const stats = document.getElementById('stats');
    const searchInput = document.getElementById('searchInput');
    const buildingFilter = document.getElementById('buildingFilter');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const formNotice = document.getElementById('formNotice');

    let allProperties = [];
    let currentEditId = null;

    function setNotice(text, isError = false) {
      formNotice.textContent = text || '';
      formNotice.classList.toggle('error', Boolean(isError));
    }

    function resetFormState() {
      currentEditId = null;
      formTitle.textContent = 'Add New Property';
      submitBtn.textContent = 'Create Property';
      cancelEditBtn.classList.add('hidden');
      propertyForm.reset();
      setNotice('');
    }

    function fillForm(property) {
      const fields = {
        building: property.building,
        property_name: property.property_name || '',
        land_size: property.land_size,
        building_size: property.building_size,
        bedrooms: property.bedrooms,
        bathrooms: property.bathrooms,
        garage: property.garage,
        carport: property.carport,
        furnishing: property.furnishing || 'None',
        clean_kitchen: property.clean_kitchen || 0,
        service_kitchen: property.service_kitchen || 0,
        electricity: property.electricity || 0,
        swimming_pool: property.swimming_pool || 0,
        security_post: property.security_post || 0,
        price: property.price
      };

      Object.entries(fields).forEach(([key, value]) => {
        const field = propertyForm.elements.namedItem(key);
        if (field) {
          field.value = value;
        }
      });

      currentEditId = property.id;
      formTitle.textContent = `Edit Property ${property.property_code || '#' + property.id}`;
      submitBtn.textContent = 'Update Property';
      cancelEditBtn.classList.remove('hidden');
      setNotice('');
      propertyForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0
      }).format(Number(value) || 0);
    }

    function collectFeatures(property) {
      const features = [];
      if (Number(property.clean_kitchen) > 0) features.push(`Clean Kitchen:${property.clean_kitchen}`);
      if (Number(property.service_kitchen) > 0) features.push(`Service Kitchen:${property.service_kitchen}`);
      if (Number(property.electricity) > 0) features.push(`Electricity:${property.electricity}`);
      if (Number(property.swimming_pool) > 0) features.push(`Pool:${property.swimming_pool}`);
      if (Number(property.security_post) > 0) features.push(`Security:${property.security_post}`);
      if (property.garage > 0) features.push(`Garage:${property.garage}`);
      if (property.carport > 0) features.push(`Carport:${property.carport}`);
      return features.length ? features.join(', ') : '-';
    }

    function getFilteredProperties() {
      const query = searchInput.value.trim().toLowerCase();
      const buildingValue = buildingFilter.value;

      return allProperties.filter((property) => {
        const matchesSearch = !query || [
          property.property_name || '',
          property.property_code || '',
          property.building || ''
        ].join(' ').toLowerCase().includes(query);

        const matchesBuilding = buildingValue === 'all' || property.building === buildingValue;
        return matchesSearch && matchesBuilding;
      });
    }

    function renderStats(properties) {
      const total = properties.length;
      const totalValue = properties.reduce((sum, p) => sum + (Number(p.price) || 0), 0);
      const avgValue = total ? totalValue / total : 0;

      stats.innerHTML = `
        <div class="stat-item"><strong>${total}</strong><span>Total Properties</span></div>
        <div class="stat-item"><strong>${formatCurrency(totalValue)}</strong><span>Total Portfolio</span></div>
        <div class="stat-item"><strong>${formatCurrency(avgValue)}</strong><span>Average Price</span></div>
      `;
    }

    function renderTable(properties) {
      if (!properties.length) {
        propertyTableBody.innerHTML = `
          <tr>
            <td colspan="9" class="empty">No matching properties found. Try a different search or filter.</td>
          </tr>
        `;
        return;
      }

      propertyTableBody.innerHTML = properties.map((p) => `
        <tr>
          <td>${p.property_code || ('#' + p.id)}</td>
          <td>${p.property_name || p.building}</td>
          <td>${p.land_size}</td>
          <td>${p.building_size}</td>
          <td>${p.bedrooms}</td>
          <td>${p.bathrooms}</td>
          <td>${formatCurrency(p.price)}</td>
          <td>${collectFeatures(p)}</td>
          <td>
            <div class="row-actions">
              <button type="button" class="secondary" onclick="editProperty(${p.id})">Edit</button>
              <button type="button" class="danger" onclick="deleteProperty(${p.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function loadProperties() {
      try {
        const response = await fetch(API_BASE);
        if (!response.ok) throw new Error('Failed to load properties');
        const data = await response.json();
        allProperties = data;
        const filtered = getFilteredProperties();
        renderStats(filtered);
        renderTable(filtered);
      } catch (error) {
        alert('Error loading properties: ' + error.message);
      }
    }

    function refreshFilteredTable() {
      const filtered = getFilteredProperties();
      renderStats(filtered);
      renderTable(filtered);
    }

    async function deleteProperty(id) {
      const confirmDelete = confirm('Delete this property?');
      if (!confirmDelete) return;

      try {
        const response = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Failed to delete property');
        }

        if (currentEditId === id) {
          resetFormState();
        }

        await loadProperties();
      } catch (error) {
        alert('Error deleting property: ' + error.message);
      }
    }

    async function editProperty(id) {
      const property = allProperties.find((item) => item.id === id);
      if (!property) return;
      fillForm(property);
    }

    propertyForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(propertyForm);

      const payload = {
        land_size: Number(formData.get('land_size')),
        building_size: Number(formData.get('building_size')),
        building: formData.get('building'),
        property_name: formData.get('property_name'),
        bedrooms: Number(formData.get('bedrooms')),
        bathrooms: Number(formData.get('bathrooms')),
        clean_kitchen: Number(formData.get('clean_kitchen') || 0),
        service_kitchen: Number(formData.get('service_kitchen') || 0),
        electricity: Number(formData.get('electricity') || 0),
        swimming_pool: Number(formData.get('swimming_pool') || 0),
        garage: Number(formData.get('garage') || 0),
        carport: Number(formData.get('carport') || 0),
        security_post: Number(formData.get('security_post') || 0),
        furnishing: formData.get('furnishing'),
        price: Number(formData.get('price'))
      };

      try {
        const endpoint = currentEditId ? `${API_BASE}/${currentEditId}` : API_BASE;
        const method = currentEditId ? 'PUT' : 'POST';

        const response = await fetch(endpoint, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || (currentEditId ? 'Failed to update property' : 'Failed to create property'));
        }

        const successText = currentEditId ? 'Property updated successfully.' : 'Property created successfully.';
        setNotice(successText);
        resetFormState();
        await loadProperties();
      } catch (error) {
        setNotice(error.message, true);
      }
    });

    cancelEditBtn.addEventListener('click', resetFormState);
    refreshBtn.addEventListener('click', loadProperties);
    searchInput.addEventListener('input', refreshFilteredTable);
    buildingFilter.addEventListener('change', refreshFilteredTable);

    window.editProperty = editProperty;
    window.deleteProperty = deleteProperty;

    resetFormState();
    loadProperties();
  </script>
</body>
</html>
